services:
  - type: web
    name: gymfinder-almaty
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run db:migrate && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/gyms
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
